capital:
  total_capital: 30000
  single_stock_min: 3000
  single_stock_max: 5000
  max_trade_count: 2

stock_filter:
  min_price: 30
  max_price: 50
  min_amount: 500000000
  min_amplitude_5d: 10
  max_rise_5d: 20
  max_ma5_deviation: 10

score_weight:
  daily_score_weight: 0.4
  tail_score_weight: 0.6

tail_confirm:
  high_close_position: 0.75
  mid_close_position: 0.6
  weak_close_position: 0.4
  morning_break_threshold: 1.015
  repair_threshold: 2.0

risk:
  max_rise_5d_warning: 18
  max_amplitude_5d_warning: 35
  high_risk_ma5_deviation: 8

runtime:
  top_n_tail_confirm: 20
  enable_cache: true
  cache_dir: cache

sector_filter:
  enabled: true
  max_per_sector: 1
  avoid_statuses:
    - 回避
  cautious_statuses:
    - 谨慎
  cautious_score_penalty: 8

dataset:
  database: sqlite
  database_path: data/dataset/trade_dataset.sqlite3
  export_dir: data/dataset
  split_dir: data/dataset/splits

llm_labeling:
  enabled: false
  provider_priority:
    - deepseek
    - doubao
    - qwen
    - glm
  max_daily_cost_cny: 20
  min_confidence: 0.7
  prompt_version: v2.5-labeling-001
  request_timeout_seconds: 20
  providers:
    deepseek:
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com/chat/completions
      model: deepseek-chat
      input_price_cny_per_million: 1.95
      output_price_cny_per_million: 7.95
    doubao:
      api_key_env: DOUBAO_API_KEY
      base_url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
      model: doubao-seed-1-6
      input_price_cny_per_million: 0.8
      output_price_cny_per_million: 2.0
    qwen:
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      model: qwen-plus
      input_price_cny_per_million: 0.8
      output_price_cny_per_million: 2.0
    glm:
      api_key_env: ZHIPUAI_API_KEY
      base_url: https://open.bigmodel.cn/api/paas/v4/chat/completions
      model: glm-4-flash
      input_price_cny_per_million: 0.0
      output_price_cny_per_million: 0.0
