services:
  - type: web
    name: t-trade-workbench
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: TZ
        value: Asia/Shanghai
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENABLE_IN_APP_SCHEDULER
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PUSHPLUS_TOKEN
        sync: false
